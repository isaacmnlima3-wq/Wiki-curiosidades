<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Curiosidade - Wiki Curiosidades</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/10449/10449540.png" type="image/x-icon">
</head>
<body>
    <header class="header-principal">
        <a href="index.html" class="logo-link" title="Voltar ao início">
            <img src="Wiki-curiosidades-m.png" alt="Logo Wiki Curiosidades" class="logo-img">
        </a>
        <div class="header-texto">
            <a href="index.html" class="titulo-home-link">
                <h1>Wiki Curiosidades</h1>
            </a>
            <p class="autor">Feito com dedicação por <span>Isaac Lima</span></p>
        </div>
    </header>

    <main class="artigo-container">
        <div class="artigo-tag-topo">Curiosidade #Número</div>
        <h1 class="artigo-titulo">Título da Curiosidade Aqui</h1>
        <h3 class="artigo-subtitulo">Subtítulo explicativo ou gancho inicial aqui.</h3>
        
        <div class="artigo-corpo">
            <p>Escreva o parágrafo explicativo da curiosidade aqui...</p>
            
            <div class="imagem-box">
                <!-- Coloque a imagem aqui: -->
                <img src="" alt="Descrição da imagem" class="curiosidade-img">
            </div>
        </div>

        <nav class="navegacao-artigo">
            <a href="index.html" class="btn-navegacao principal">
                <span class="icone-btn">←</span> Voltar para o início
            </a>
        </nav>
    </main>

    <footer class="rodape">
        <p>&copy; Wiki Curiosidades — Conhecimento rápido e descomplicado.</p>
    </footer>
</body>
</html>
