        <h1 style="color: #00ff00;">Um dia em Vênus é mais longo que um ano em Vênus</h1>
        <p>Vênus demora 243 dias terrestres para dar uma volta sobre seu próprio eixo (um dia), mas apenas 225 dias terrestres para dar uma volta ao redor do Sol (um ano).</p>
