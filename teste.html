<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Completa</title>
  <style>
    /* Estilização para a calculadora ficar centralizada e bonita */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .calculadora {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      width: 300px;
    }

    #visor {
      width: 100%;
      height: 60px;
      background-color: #252525;
      border: none;
      color: #fff;
      font-size: 2rem;
      text-align: right;
      padding: 0 10px;
      box-sizing: border-box;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 50px;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #333;
      color: #fff;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #444;
    }

    /* Cores especiais para os operadores e botão de limpar */
    button.operador {
      background-color: #ff9f0a;
      color: #fff;
    }

    button.operador:hover {
      background-color: #cc7f08;
    }

    button.limpar {
      background-color: #a5a5a5;
      color: #000;
    }

    button.limpar:hover {
      background-color: #8e8e8e;
    }

    button.igual {
      grid-column: span 2; /* Faz o botão '=' ocupar duas colunas */
      background-color: #248a3d;
    }

    button.igual:hover {
      background-color: #1e7232;
    }
  </style>
</head>
<body>

<div class="calculadora">
  <!-- Visor que mostra os números e o resultado -->
  <input type="text" id="visor" disabled />

  <!-- Teclado da calculadora -->
  <div class="botoes">
    <button class="limpar" onclick="limpar()">C</button>
    <button onclick="adicionar('/')" class="operador">÷</button>
    <button onclick="adicionar('*')" class="operador">×</button>
    <button onclick="adicionar('-')" class="operador">-</button>

    <button onclick="adicionar('7')">7</button>
    <button onclick="adicionar('8')">8</button>
    <button onclick="adicionar('9')">9</button>
    <button onclick="adicionar('+')" class="operador">+</button>

    <button onclick="adicionar('4')">4</button>
    <button onclick="adicionar('5')">5</button>
    <button onclick="adicionar('6')">6</button>
    <button onclick="adicionar('.')">.</button>

    <button onclick="adicionar('1')">1</button>
    <button onclick="adicionar('2')">2</button>
    <button onclick="adicionar('3')">3</button>
    <button onclick="adicionar('0')">0</button>

    <button class="igual" onclick="calcular()">=</button>
  </div>
</div>

<script>
  // Insere o caractere clicado no visor
  function adicionar(valor) {
    document.getElementById('visor').value += valor;
  }

  // Apaga tudo o que está no visor
  function limpar() {
    document.getElementById('visor').value = '';
  }

  // Faz a conta matemática usando os dados do visor
  function calcular() {
    let expressao = document.getElementById('visor').value;
    
    // Tratamento simples caso o visor esteja vazio
    if (expressao) {
      try {
        // Resolve a conta matemática expressa no texto
        let resultado = eval(expressao);
        document.getElementById('visor').value = resultado;
      } catch (erro) {
        document.getElementById('visor').value = 'Erro';
      }
    }
  }
</script>

</body>
</html>
